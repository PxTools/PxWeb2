# .github/workflows/chromatic-skip.yml

name: 'Chromatic'

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'packages/pxweb2-ui/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'packages/pxweb2-ui/**'

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@882b4728513a3720bfcd27bd9ad1260c603c6090 # v18.13.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          skip: true
