# .github/workflows/chromatic-skip.yml

name: 'Chromatic'

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'packages/pxweb2-ui/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'packages/pxweb2-ui/**'

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Publish to Chromatic
        uses: chromaui/action@5bcadb5104b09e360e210c54f95a7437c2d82bab # v18.13.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          skip: true
